<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="productModalTitle">Nuevo Producto</h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar">
                </button>
            </div>

            <div class="modal-body">

                <div class="form-grid">
                    <div class="form-group span-2">
                        <label>Nombre del producto *</label>
                        <input type="text" id="pName" class="validarProducto">
                    </div>

                    <div class="form-group">
                        <label>Categoría *</label>
                        <select id="pCategory" class="validarProducto">
                            <option value="">Selecciona una categoría</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Precio base *</label>
                        <input type="number" id="pPrice" class="validarProducto">
                    </div>

                    <div class="form-group span-2">
                        <label>Descripción</label>
                        <textarea id="pDesc" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Stock inicial</label>
                        <input type="number" id="pStock" value="0" class="validarProducto">
                    </div>

                    <div class="form-group">
                        <label>Stock minimo</label>
                        <input type="number" id="pStockMinimo" value="1" class="validarProducto">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="app-btn app-btn-primary" onclick="productsView.saveProduct()">
                    <i class="fas fa-save"></i>
                    Guardar producto
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="categoryModalTitle">
                    Nueva categoría
                </h5>
                <button class="btn-close" data-bs-dismiss="modal">
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Nombre</label>
                    <input id="cName" type="text">
                </div>

                <div class="form-switch-custom">
                    <div style="width: 85%;">
                        <label for="cHasVariants">
                            <i class="fas fa-layer-group"></i>
                            Maneja variantes
                        </label>
                        <small>
                            Los productos de esta categoría podrán tener variantes como talla, color, presentación o
                            capacidad.
                        </small>
                    </div>

                    <label class="switch">
                        <input type="checkbox" id="cHasVariants">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="app-btn app-btn-primary" onclick="categoriesView.saveCategory()">
                    <i class="fas fa-save"></i>
                    Guardar
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="stockModal">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5>
                    <i class="fas fa-boxes"></i>
                    Movimiento de stock
                </h5>
                <button class="btn-close" data-bs-dismiss="modal">
                </button>
            </div>
            <div class="modal-body form-grid">
                <input type="hidden" id="stockProductId">
                <div class="form-group">
                    <label>
                        Producto
                    </label>
                    <select id="dropProducto">
                        <option value="">Selecciona una producto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        Tipo movimiento
                    </label>

                    <select id="stockType">
                        <option value="0">
                            Entrada
                        </option>

                        <option value="1">
                            Salida
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label> Cantidad </label>
                    <input type="number" id="stockQuantity" value="1" min="1">
                </div>

                <div class="form-group">
                    <label>
                        Motivo
                    </label>
                    <textarea id="stockReason" placeholder="Compra, venta, ajuste..."></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button class="app-btn app-btn-primary" onclick="movementsView.saveMovement()">
                    Guardar
                </button>
            </div>
        </div>
    </div>
</div>
